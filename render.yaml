services:
  # Backend (FastAPI)
  - type: web
    name: mummyas-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false # zadá se ručně v Renderu (obsahuje heslo)
      - key: SUPABASE_URL
        value: https://nayivuagrbjklmtinfjv.supabase.co

  # Webová aplikace (PWA)
  - type: web
    name: mummyas-web
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false # HTTPS adresa backendu, např. https://mummyas-api.onrender.com
